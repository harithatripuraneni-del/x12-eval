[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x12-eval"
version = "0.1.0"
description = "Score generated X12 EDI against known-good files: element-level accuracy that can gate a build."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Haritha Tripuraneni" }]
keywords = ["edi", "x12", "evaluation", "llm", "testing"]
dependencies = ["x12-mcp @ git+https://github.com/harithatripuraneni-del/x12-mcp.git"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
x12-eval = "x12_eval.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/x12_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
